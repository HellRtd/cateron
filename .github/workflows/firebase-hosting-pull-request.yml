name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # --legacy-peer-deps: @material-ui/core@4 declares a peer of react@^16
      # while the app runs react@17, which plain `npm ci` refuses to resolve.
      - run: npm ci --legacy-peer-deps && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATERON_74B4C }}'
          projectId: cateron-74b4c
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
